# Checks on pushes to main and on pull requests (the repository is public, so Actions minutes
# are free). Nothing deploys from here: releases are zips built from a tagged commit (and,
# once approved, the WordPress.org SVN).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # WordPress Coding Standards and PHP 7.4 compatibility (phpcs.xml.dist; fails on any error or
  # warning), then static analysis at level 6 (phpstan.neon.dist, with WordPress and
  # WooCommerce stubs).
  static-analysis:
    runs-on: ubuntu-24.04
    container: composer:2.8
    steps:
      - uses: actions/checkout@v4
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpcs -i
      - run: vendor/bin/phpcs
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  # Syntax check, then PHPUnit (tests/, phpunit.xml.dist): the WordPress test suite with
  # WooCommerce, on a MySQL database the suite empties, on the oldest PHP the plugin supports
  # (Requires PHP: 7.4) and a current one.
  phpunit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.4']
    # PHP from setup-php on the runner, not the php:X-cli image: php:7.4-cli is Debian 11,
    # whose package archive no longer serves the tools the job needs (unzip).
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: wordpress_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
    env:
      WP_TESTS_DB_HOST: 127.0.0.1
      WP_TESTS_DB_PASSWORD: root
      WP_CORE_DIR: /tmp/wordpress
      WP_VERSION: 7.1.3 # Tested up to in readme.txt
      WC_VERSION: 11.2.1
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          tools: composer:v2
          coverage: none
      - name: Install development tools, WordPress and WooCommerce
        run: |
          composer install --no-interaction --no-progress
          mkdir -p "$WP_CORE_DIR"
          curl -sSfL "https://wordpress.org/wordpress-$WP_VERSION.tar.gz" | tar -xz --strip-components=1 -C "$WP_CORE_DIR"
          curl -sSfL -o /tmp/woocommerce.zip "https://downloads.wordpress.org/plugin/woocommerce.$WC_VERSION.zip"
          unzip -q /tmp/woocommerce.zip -d "$WP_CORE_DIR/wp-content/plugins"
      - name: Wait for MySQL
        run: |
          # shellcheck disable=SC2016 # the single quotes keep the PHP code's $ from the shell
          php -r 'for ($i = 0; $i < 30; $i++) { if (@mysqli_connect(getenv("WP_TESTS_DB_HOST"), "root", getenv("WP_TESTS_DB_PASSWORD"))) { exit(0); } sleep(2); } fwrite(STDERR, "MySQL did not start\n"); exit(1);'
      - run: php -v
      - run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - run: vendor/bin/phpunit
