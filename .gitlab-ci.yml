# Checks run on every branch and merge request. Nothing deploys from here: releases
# are zips built from a tagged commit (and, once approved, the WordPress.org SVN).

stages:
  - test

# One pipeline per change: merge request pipelines when an MR is open, branch pipelines otherwise.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

# Syntax on the oldest PHP the plugin supports (Requires PHP: 7.4) and a current one.
.php-lint:
  stage: test
  script:
    - php -v
    - find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

php-7.4:
  extends: .php-lint
  image: php:7.4-cli

php-8.4:
  extends: .php-lint
  image: php:8.4-cli

# WordPress Coding Standards and PHP 7.4 compatibility (phpcs.xml.dist); fails on any error or warning.
phpcs:
  stage: test
  image: composer:2.8
  script:
    - composer install --no-interaction --no-progress
    - vendor/bin/phpcs -i
    - vendor/bin/phpcs

# Static analysis at level 5 (phpstan.neon.dist), with WordPress and WooCommerce stubs.
phpstan:
  stage: test
  image: composer:2.8
  script:
    - composer install --no-interaction --no-progress
    - vendor/bin/phpstan analyse --no-progress --memory-limit=1G
