# Checks run on every branch and merge request. Nothing deploys from here: releases
# are zips built from a tagged commit (and, once approved, the WordPress.org SVN).

stages:
  - test

# One pipeline per change: merge request pipelines when an MR is open, branch pipelines otherwise.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

# WordPress Coding Standards and PHP 7.4 compatibility (phpcs.xml.dist; fails on any error or
# warning), then static analysis at level 5 (phpstan.neon.dist, with WordPress and WooCommerce
# stubs). One job, so Composer installs once.
static-analysis:
  stage: test
  image: composer:2.8
  script:
    - composer install --no-interaction --no-progress
    - vendor/bin/phpcs -i
    - vendor/bin/phpcs
    - vendor/bin/phpstan analyse --no-progress --memory-limit=1G

# Syntax check, then PHPUnit (tests/, phpunit.xml.dist): the WordPress test suite with
# WooCommerce, on a MySQL database the suite empties, on the oldest PHP the plugin supports
# (Requires PHP: 7.4) and a current one.
.phpunit:
  stage: test
  services:
    - name: mysql:8.4
      alias: mysql
  variables:
    MYSQL_DATABASE: wordpress_test
    MYSQL_ROOT_PASSWORD: root
    WP_TESTS_DB_HOST: mysql
    WP_TESTS_DB_PASSWORD: root
    WP_CORE_DIR: /tmp/wordpress
    WP_VERSION: 7.1.3 # Tested up to in readme.txt
    WC_VERSION: 11.2.1
  before_script:
    - apt-get update -qq && apt-get install -y -qq unzip > /dev/null
    - docker-php-ext-install mysqli > /dev/null
    - curl -sS https://getcomposer.org/installer | php -- --quiet --install-dir=/usr/local/bin --filename=composer
    - composer install --no-interaction --no-progress
    - mkdir -p "$WP_CORE_DIR"
    - curl -sSfL "https://wordpress.org/wordpress-$WP_VERSION.tar.gz" | tar -xz --strip-components=1 -C "$WP_CORE_DIR"
    - curl -sSfL -o /tmp/woocommerce.zip "https://downloads.wordpress.org/plugin/woocommerce.$WC_VERSION.zip"
    - unzip -q /tmp/woocommerce.zip -d "$WP_CORE_DIR/wp-content/plugins"
    - |
      php -r 'for ($i = 0; $i < 30; $i++) { if (@mysqli_connect(getenv("WP_TESTS_DB_HOST"), "root", getenv("WP_TESTS_DB_PASSWORD"))) { exit(0); } sleep(2); } fwrite(STDERR, "MySQL did not start\n"); exit(1);'
  script:
    - php -v
    - find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
    - vendor/bin/phpunit

phpunit-7.4:
  extends: .phpunit
  image: php:7.4-cli

phpunit-8.4:
  extends: .phpunit
  image: php:8.4-cli
